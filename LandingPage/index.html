<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080a" />
    <meta
      name="description"
      content="Handpicked homes, plots and rentals — curated listings with photos, walkthrough reels and a team that answers on WhatsApp."
    />
    <title>Aurum Estates — Handpicked homes, honestly presented</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Painted before React mounts, so the very first frame is already the
         site's own black instead of the browser's default white — a public
         page gets exactly one first impression, and a white flash is the
         cheapest possible way to waste it. */
      html {
        background: #08080a;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #boot span {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(228, 195, 122, 0.22);
        border-top-color: #e4c37a;
        animation: boot-spin 800ms linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
